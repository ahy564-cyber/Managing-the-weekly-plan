<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تقرير التدقيق - الأسبوع {{ week }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; margin: 20px; background: #f8fafc; color: #1e293b; }
        .card { background: white; padding: 25px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); border: 1px solid #0d9488; }
        h1 { color: #134e4a; border-bottom: 3px solid #0d9488; padding-bottom: 12px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 15px; background: white; border: 1px solid #0d9488; border-radius: 8px; overflow: hidden; }
        th, td { padding: 15px; text-align: center; border-bottom: 1px solid #f0fdfa; border-left: 1px solid #f0fdfa; }
        th { background: #0d9488; color: white; font-weight: 700; }
        .no-data { text-align: center; padding: 30px; color: #64748b; font-size: 1.2em; }
        .btn-back { background: #0d9488; color: white; border: none; padding: 10px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-block; margin-bottom: 20px; }
    </style>
</head>
<body>
    <a href="/admin" class="btn-back">العودة للوحة التحكم</a>
    <div class="card">
        <h1>تقرير المواد التي لم يتم تحضيرها - الأسبوع {{ week }}</h1>
        {% if report %}
        <table>
            <thead>
                <tr>
                    <th>المادة</th>
                    <th>الصف والفصل</th>
                    <th>اليوم</th>
                    <th>الحصة</th>
                </tr>
            </thead>
            <tbody>
                {% for item in report %}
                <tr>
                    <td>{{ item.subject }}</td>
                    <td>{{ item.grade }}</td>
                    <td>{{ item.day }}</td>
                    <td>{{ item.period }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <div class="no-data">جميع المواد تم تحضيرها لهذا الأسبوع! ✓</div>
        {% endif %}
    </div>
</body>
</html>
