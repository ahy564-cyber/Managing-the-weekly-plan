<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الخطة الدراسية الأسبوعية</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #ecf0f1; }
        .container { background: #fff; padding: 50px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 450px; width: 100%; }
        h1 { color: #2c3e50; margin-bottom: 10px; font-size: 2em; }
        p { color: #7f8c8d; margin-bottom: 35px; font-size: 1.1em; }
        .links { display: flex; flex-direction: column; gap: 20px; }
        .btn { padding: 18px; border-radius: 10px; text-decoration: none; font-weight: bold; transition: all 0.3s; font-size: 1.2em; text-align: center; }
        .btn-student { background: #3498db; color: white; }
        .btn-student:hover { background: #2980b9; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3); }
        .btn-login { background: #fff; color: #3498db; border: 2px solid #3498db; }
        .btn-login:hover { background: #ebf5fb; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(52, 152, 219, 0.1); }
        .status { margin-top: 30px; font-size: 1em; color: #95a5a6; border-top: 1px solid #eee; padding-top: 20px; }
        strong { color: #2c3e50; }
    </style>
</head>
<body>
    <div class="container">
        <h1>نظام الخطة الدراسية</h1>
        <p>إدارة وعرض الجداول المدرسية الأسبوعية</p>
        
        <div class="links">
            <a href="/student" class="btn btn-student">عرض الطالب</a>
            <a href="/login" class="btn btn-login">دخول (مدير / معلم)</a>
        </div>
        
        <div class="status">
            الأسبوع الحالي: <strong>{{ current_week }}</strong>
        </div>
    </div>
</body>
</html>
