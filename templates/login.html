<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام الخطة الدراسية</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #ecf0f1; }
        .login-card { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        h1 { color: #2c3e50; margin-bottom: 30px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1em; text-align: center; }
        button { background: #3498db; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; font-size: 1.1em; transition: background 0.3s; }
        button:hover { background: #2980b9; }
        .error { color: #e74c3c; margin-bottom: 20px; font-weight: bold; }
        .back { margin-top: 20px; display: block; color: #7f8c8d; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>تسجيل دخول المدرسة</h1>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="error">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="username" placeholder="اسم مستخدم المدرسة" required>
            <input type="password" name="password" placeholder="كلمة المرور" required>
            <button type="submit">دخول</button>
        </form>
        <div style="margin-top: 20px;">
            <a href="/super-admin/login" style="color: #64748b; font-size: 0.8em; text-decoration: none;">دخول النظام العام</a>
        </div>
        <a href="/" class="back">العودة للقائمة الرئيسية</a>
    </div>
</body>
</html>
